#--- UX --- #

f           set fullscreen yes            # event: click      # Enter Fullscreen
ESC         set fullscreen no             # event: click      # Exit Fullscreen
ESC         show-text "Press `ESC` again to quit"  # event: double_click   # Exit Confirmation
ESC         quit                          # event: triple_click   # Exit App


#--- Custom Menu --- #

Ctrl+MBTN_Right  script-binding select/context-menu  # Open Context Menu
B           script-binding autosub/download_subs  #custom-menu: Download Subs 1
Ctrl+b      script-binding autosub/download_subs2  #custom-menu: Download Subs 2
f           script-binding quality-menu/video_formats_toggle  #custom-menu: Show Video Formats
Alt+f       script-binding quality-menu/audio_formats_toggle  #custom-menu: Show Audio Formats
Ctrl+l      script-binding quality-menu/video_formats_toggle  #! Stream Quality > Video
Alt+l       script-binding quality-menu/audio_formats_toggle  #! Stream Quality > Audio
F8          script-message playlist-manager show playlist toggle  #custom-menu: Toggle Playlist
R           run "cmd.exe" /d /c start "" ${path} ; quit-watch-later  #custom-menu: Hot Restart


#--- Playback --- #

c           revert-seek                   # Jump to Mark
v           revert-seek mark              # Mark Position
KP7         playlist-prev                 # Next File
KP9         playlist-next                 # Previous File
z           repeatable script-message playback-controls seek  -2  # Seek 2s backward
x           repeatable script-message playback-controls seek   2  # Seek 2s forward
a           repeatable script-message playback-controls seek  -5  # Seek 5s backward
s           repeatable script-message playback-controls seek   5  # Seek 5s forward
q           repeatable script-message playback-controls seek -10  # Seek 10s backward
w           repeatable script-message playback-controls seek  10  # Seek 10s forward
LEFT        repeatable script-message playback-controls seek -10  # Seek 10s backward
RIGHT       repeatable script-message playback-controls seek  10  # Seek 10s forward
KP1         repeatable script-message playback-controls seek -30  # Seek 30s backward
KP3         repeatable script-message playback-controls seek  30  # Seek 30s forward
KP4         repeatable script-message playback-controls seek -60  # Seek 60s backward
KP6         repeatable script-message playback-controls seek  60  # Seek 60s forward


