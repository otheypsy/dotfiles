
# --- UX --- #
osc=no
osd-bar=no
title-bar=no
osd-duration=2000
osd-font=Space Mono
osd-outline-size=1
cursor-autohide=500
taskbar-progress=no
keep-open=yes
snap-window=yes
autofit-larger=80%x80%
autofit-smaller=20%x20%
input-doubleclick-time=200
load-context-menu=yes
load-stats-overlay=no
reset-on-next-file=video-zoom,panscan,video-unscaled,video-rotate,video-align-x,video-align-y,volume
# input-ipc-server=\\.\pipe\mpvsocket
# input-commands=load-input-conf ~~/custom/inputs/core.conf
# input-commands-append=load-input-conf ~~/custom/inputs/playback.conf
# input-commands-append=load-input-conf ~~/custom/inputs/profiles.conf

# ---- Base Profiles ---- #
profile=high-quality
libplacebo-opts=preset=high_quality
load-auto-profiles=no

# --- Audio --- #
replaygain=album
volume=100
volume-max=150
audio-pitch-correction=no
audio-channels=auto-safe
alang=eng,en

# --- Subtitles --- #
sub-font=Space Mono
sub-pos=95
sub-scale=1.0
sub-gauss=1.0
sub-gray=yes
sub-ass-override=no
sub-fix-timing=yes
blend-subtitles=yes
sub-auto=fuzzy
slang=en,eng
watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y

# --- Playback --- #
pause=yes
loop-file=no
loop-playlist=yes
script-opt=osc-playlist_osd=no
script-opt=osc-chapters_osd=no
autocreate-playlist=no
hr-seek=yes
deinterlace=auto
video-aspect-override=no
video-aspect-method=container
demuxer-thread=yes

# --- Streaming --- #
ytdl=yes
ytdl-format=bestvideo[vcodec^=avc1]+bestaudio/best
script-opt=ytdl_hook-try_ytdl_first=yes
script-opt='ytdl_hook-exclude="%.webm$|%.ts$|%.mp3$|%.m3u8$|%.m3u$|%.mkv$|%.mp4$|%.VOB$"'

# --- Rendering --- #
vo=gpu-next
gpu-api=vulkan
gpu-context=winvk
hwdec=vulkan
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1
vd-lavc-dr=yes

# --- Motion Interpolation --- #
video-sync=display-resample
interpolation=yes
tscale=sphinx
tscale-blur=0.6991556596428412
tscale-radius=1.01
tscale-clamp=0.0

# --- Deband --- #
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=0

# --- Anti-Ringing --- #
scale-antiring=0.6

# --- Scaling --- #
scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=hermite

# --- Profiles --- #
# include=~~/custom/profiles/hdr-toys.conf
include=~~/custom/profiles/hdr.conf
include=~~/custom/profiles/shaders.conf
include=~~/custom/profiles/media.conf
